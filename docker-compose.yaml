name: wiz-spring-development

services:
  development:
    image: ${WIZ_SPRING_IMAGE:-registry.nanoha.kr/kwon3286/wiz-spring:1.2.2}
    platform: linux/amd64
    environment:
      WIZ_ENABLE_SSH: ${WIZ_ENABLE_SSH:-true}
      SSH_PASSWORD: ${SSH_PASSWORD:-wiz-spring-dev}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wiz}
      POSTGRES_USER: ${POSTGRES_USER:-wiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiz-spring-dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wiz-spring-dev}
    ports:
      - "127.0.0.1:${WIZ_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${WIZ_SSH_PORT:-2222}:22"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiz}
      POSTGRES_USER: ${POSTGRES_USER:-wiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiz-spring-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wiz-spring-dev}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgresql-data:
  redis-data:
