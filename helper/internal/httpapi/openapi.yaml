openapi: 3.1.0
info:
  title: WIZ Spring Project Helper API
  version: 1.1.0
  description: Generates a fresh WIZ Spring 1.1.0 project and returns it as a ZIP archive.
servers:
  - url: http://127.0.0.1:8080
paths:
  /:
    get:
      summary: List supported frontend templates
      description: Returns the same template registry response as GET /api/v1/templates.
      responses:
        '200':
          description: Template list and default template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
  /api/v1/projects:
    post:
      summary: Generate a project archive
      description: >-
        Accepts exactly one input style: query parameters, an application/json body,
        or an application/x-www-form-urlencoded body. Do not mix query parameters
        with a request body. When using query parameters, projectName and packageName
        are required. When template is omitted, the image registry default is used.
      parameters:
        - name: projectName
          in: query
          required: false
          description: Required when the query-string input style is used.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
          example: test-wiz
        - name: packageName
          in: query
          required: false
          description: Required when the query-string input style is used. Java keywords and the java namespace are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[A-Za-z_$][A-Za-z0-9_$]*(?:\.[A-Za-z_$][A-Za-z0-9_$]*)*$'
          example: kr.nanoha.testwiz
        - name: template
          in: query
          required: false
          description: Template ID from GET /api/v1/templates. When omitted, the image registry default is used; an explicit empty value is invalid.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
          example: angular-wiz
      requestBody:
        required: false
        description: Supply either this request body or query parameters, never both.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Generated project ZIP with one top-level project directory.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
            X-Wiz-Spring-Version:
              schema:
                type: string
            X-Project-Template:
              schema:
                type: string
            X-Base-Template:
              description: Built-in WIZ Spring template used before registry customization.
              schema:
                type: string
                enum: [angular-wiz, angular, react, html, jsp]
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /api/v1/templates:
    get:
      summary: List supported frontend templates
      responses:
        '200':
          description: Template list and default template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
  /api/v1/version:
    get:
      summary: Return helper and generator versions
      responses:
        '200':
          description: Version information.
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: The HTTP process is alive.
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: The configured JAR passed cached startup version and disposable-project generation probes.
components:
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [projectName, packageName]
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
          examples: [test-wiz]
        packageName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z_$][A-Za-z0-9_$]*(?:\.[A-Za-z_$][A-Za-z0-9_$]*)*$'
          description: Conservative ASCII subset of Java 21 identifiers; Java keywords and the java namespace are rejected.
          examples: [kr.nanoha.testwiz]
        template:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
          description: Template ID from GET /api/v1/templates. When omitted, the image registry default is used; an explicit empty string or null is invalid.
          examples: [angular-wiz, company-react]
    TemplateSummary:
      type: object
      additionalProperties: false
      required: [id, base, description]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
        base:
          type: string
          enum: [angular-wiz, angular, react, html, jsp]
          description: Built-in WIZ Spring template used before registry customizations are applied.
        description:
          type: string
    TemplateList:
      type: object
      additionalProperties: false
      required: [default, templates]
      properties:
        default:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
          description: Template ID selected when a create request omits template.
        templates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TemplateSummary'
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
  responses:
    Problem:
      description: RFC 9457-style error response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
