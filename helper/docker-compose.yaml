services:
  helper:
    build:
      context: .
      args:
        WIZ_HELPER_TEMPLATE_FILE: ${WIZ_HELPER_TEMPLATE_FILE:-registry.json}
    image: wiz-spring-helper:1.1.0
    environment:
      WIZ_HELPER_ADDR: 0.0.0.0:8080
      WIZ_HELPER_MAX_CONCURRENT: ${WIZ_HELPER_MAX_CONCURRENT:-2}
      WIZ_HELPER_GENERATION_TIMEOUT: ${WIZ_HELPER_GENERATION_TIMEOUT:-45s}
      WIZ_HELPER_WORK_DIR: /work
      WIZ_SPRING_SOURCE_JAR: /opt/wiz-source/wiz-spring.jar
      WIZ_SPRING_SHA256: ${WIZ_SPRING_SHA256:-}
    volumes:
      - ../target/wiz-spring-1.1.0.jar:/opt/wiz-source/wiz-spring.jar:ro
    ports:
      - "127.0.0.1:${WIZ_HELPER_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /work:size=512m,uid=10001,gid=10001,mode=0700
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "setpriv", "--reuid=10001", "--regid=10001", "--clear-groups", "--no-new-privs", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
    restart: unless-stopped
