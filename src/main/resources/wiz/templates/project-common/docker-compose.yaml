name: __WIZ_COMPOSE_PROJECT__

services:
  backend:
    build:
      context: ${BUNDLE_DIR:-./bundle}
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        APP_ARTIFACT: ${APP_ARTIFACT:-application.__WIZ_ARTIFACT_TYPE__}
    environment:
      SPRING_PROFILES_ACTIVE: prod,bundle
      APP_API_PREFIX: ${APP_API_PREFIX:-/api}
      SERVER_PORT: 8080
    expose:
      - "8080"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    profiles: ["nginx"]
    build:
      context: ${BUNDLE_DIR:-./bundle}
      dockerfile: deploy/nginx/Dockerfile
    environment:
      API_PREFIX: ${APP_API_PREFIX:-/api}
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  apache2:
    profiles: ["apache2"]
    build:
      context: ${BUNDLE_DIR:-./bundle}
      dockerfile: deploy/apache2/Dockerfile
    environment:
      API_PREFIX: ${APP_API_PREFIX:-/api}
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
