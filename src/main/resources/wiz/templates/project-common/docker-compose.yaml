name: __WIZ_COMPOSE_PROJECT__

services:
  application:
    image: eclipse-temurin:25-jre
    working_dir: /opt/application
    command: ["java", "-jar", "${APP_ARTIFACT:-application.__WIZ_ARTIFACT_TYPE__}"]
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./${APP_ARTIFACT:-application.__WIZ_ARTIFACT_TYPE__}:/opt/application/${APP_ARTIFACT:-application.__WIZ_ARTIFACT_TYPE__}:ro
      - ./public:/opt/application/public:ro
      - application-data:/opt/application/data
    restart: unless-stopped

volumes:
  application-data:
