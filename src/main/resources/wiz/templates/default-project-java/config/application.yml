# WIZ Spring workspace 설정입니다.
# 기본값을 바꾸고 싶을 때만 주석을 해제하세요.
# 이 파일은 환경별 값이나 비밀 값을 포함할 수 있어 생성된 .gitignore에서 제외됩니다.
# 공유할 설정은 config/application.example.yml에 반영하세요.
#
# 로드 순서:
# 1. wiz-spring core 기본값
# 2. workspace config/application.yml, 이 파일
# 3. profile 파일(application-dev.yml 또는 application-prod.yml)
# 4. CLI 옵션(wiz-spring run --host --port --profile)
#
# sample DB/auth/session 구현은 workspace source에 있습니다.
# 앱마다 필요한 값만 바꾸고, wiz-spring core jar는 수정하지 않는 것을 권장합니다.
#
# HTTP 서버 포트와 bind host는 이 파일 또는 CLI 옵션에서 관리합니다.
# `wiz-spring run --port` 또는 `wiz-spring run --host`가 있으면 workspace 설정보다 우선합니다.
# Session cookie 공통 기본값은 cookie-only, HttpOnly, SameSite=Lax입니다.
# 개발/운영의 Secure 차이는 application-dev.yml과 application-prod.yml에서 관리합니다.
# timeout, cookie name/path/domain 또는 cross-site 정책을 바꿀 때만 아래 예시를 사용하세요.
# server:
#   servlet:
#     session:
#       timeout: 30m
#       cookie:
#         name: JSESSIONID
#         path: /
#         # Cross-site cookie가 꼭 필요할 때만 SameSite=None과 Secure=true를 함께 사용하세요.
#         same-site: lax
#
# 내장 Tomcat worker thread/connections 설정이 필요하면 아래 예시만 주석 해제하세요.
# server:
#   tomcat:
#     threads:
#       max: 200
#       min-spare: 10
#     accept-count: 100
#     max-connections: 8192

server:
  servlet:
    session:
      # Session ID를 URL에 노출하지 않고 cookie로만 전달합니다.
      tracking-modes:
        - cookie
      cookie:
        http-only: true
        same-site: lax

wiz:
  java:
    package-root: __WIZ_PACKAGE_ROOT__

# 아래 값들은 core 기본값과 다를 때만 `wiz:` 아래에 추가하세요.
# api.prefix: /wiz/api
# http.max-request-body-bytes: 0
# socket.path: /wiz/app
# socket.allowed-origins: ["*"]
# socket.polling-session-ttl-millis: 120000
# socket.max-polling-sessions: 1024
# socket.polling-queue-capacity: 256
# redirect.policy: any
# redirect.allowed-hosts: []
# runtime.devmode-cookie-name: season-wiz-devmode
# runtime.warmup-enabled: true
# auth.service-class와 session.service-class는 convention 경로를 벗어날 때만 지정합니다.

# Sample app은 별도 설정이 없으면 workspace source의 SQLite/JPA 기본값으로 실행됩니다.
# DB를 바꿀 때만 아래처럼 필요한 값을 추가하고 matching JDBC driver를 pom.xml에 추가하세요.
# sample:
#   datasource:
#     url: jdbc:postgresql://localhost:5432/wiz_sample
#     driver-class-name: org.postgresql.Driver
#     username: wiz
#     password: change-me
#   jpa:
#     dialect: org.hibernate.dialect.PostgreSQLDialect
#     hbm2ddl-auto: validate
