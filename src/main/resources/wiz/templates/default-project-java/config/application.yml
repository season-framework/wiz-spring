# WIZ Spring 프로젝트 공통 설정입니다.
# 기본값을 바꾸고 싶을 때만 주석을 해제하세요.
#
# 로드 순서:
# 1. wiz-spring core 기본값
# 2. workspace config/application.yml
# 3. project/<name>/config/application.yml, 이 파일
# 4. profile 파일(application-dev.yml 또는 application-prod.yml)
# 5. CLI 옵션(wiz-spring run --host --port --profile)
#
# sample project의 DB/auth/session 구현은 project source에 있습니다.
# project마다 필요한 값만 바꾸고, wiz-spring core jar는 수정하지 않는 것을 권장합니다.
#
# HTTP 서버 포트와 bind host는 workspace config/application.yml에서 관리합니다.
# project config에서 server.port를 다시 지정하면 workspace 포트와 충돌할 수 있습니다.
# `wiz-spring run --port` 또는 `wiz-spring run --host`가 있으면 workspace 설정보다 우선합니다.
#
# 내장 Tomcat worker thread/connections 설정이 필요하면 아래 예시만 주석 해제하세요.
# server:
#   tomcat:
#     threads:
#       max: 200
#       min-spare: 10
#     accept-count: 100
#     max-connections: 8192

wiz:
  api:
    # 페이지 API prefix입니다. backend App API route와 frontend Wiz client가 같은 값을 사용합니다.
    # 기본값: /wiz/api
    # prefix: /wiz/api

  http:
    # JSON/form 요청 body 최대 크기(bytes)입니다.
    # 기본값: 0
    # 0이면 WIZ runtime에서 추가 제한을 두지 않습니다.
    # max-request-body-bytes: 0

  socket:
    # WebSocket 및 Socket.IO polling allowed origins입니다.
    # 기본값: ["*"]
    # allowed-origins:
    #   - "*"
    # Socket.IO polling session idle TTL(ms)입니다.
    # 기본값: 120000
    # 0이면 TTL 정리를 비활성화합니다.
    # polling-session-ttl-millis: 120000
    # Socket.IO polling session 최대 개수입니다.
    # 기본값: 1024
    # 0이면 session 개수 제한을 두지 않습니다.
    # max-polling-sessions: 1024
    # session별 outbound queue 최대 packet 수입니다.
    # 기본값: 256
    # polling-queue-capacity: 256

  redirect:
    # logout redirect 검증 정책입니다.
    # 기본값: any
    # any: 기존처럼 요청 redirect 값을 그대로 사용합니다.
    # local-only: /로 시작하는 local path만 허용하고 나머지는 /로 보냅니다.
    # allowlist: local path 또는 allowed-hosts에 있는 외부 host만 허용합니다.
    # policy: any
    # allowed-hosts: []

  project:
    # 요청에 project cookie가 없을 때 선택하는 기본 project 이름입니다.
    # 기본값: main
    default-name: main
    # 여러 WIZ runtime이 같은 domain을 공유할 때 cookie 이름을 바꿀 수 있습니다.
    # 기본값: season-wiz-project
    # cookie-name: season-wiz-project
    # 기본값: season-wiz-devmode
    # devmode-cookie-name: season-wiz-devmode
    # cookie로 project를 전환할 수 있는지 여부입니다.
    # 기본값: true
    # dev profile은 true, prod profile은 false를 권장합니다.
    # 운영 multi-project hosting은 cookie 전환 대신 host/path routing과 ACL로 분리하세요.
    # cookie-selection-enabled: true

  # Auth/session service는 아래 위치에서 자동 탐지됩니다.
  # - src/model/AuthService.java
  # - src/model/SessionService.java
  # 다른 위치로 옮겼을 때만 명시 class 이름을 설정하세요.
  # 기본값: convention 자동 탐지
  # auth:
  #   service-class: com.wiz.project.main.model.AuthService
  # session:
  #   service-class: com.wiz.project.main.model.SessionService

sample:
  # Sample-project database settings.
  #
  # Default is SQLite so a freshly created project runs without an external DB.
  # To use MySQL or PostgreSQL:
  # 1. Add the matching JDBC driver dependency in pom.xml.
  # 2. Replace url/driver-class-name/username/password below.
  # 3. Set sample.jpa.dialect for the selected database.
  datasource:
    # SQLite default:
    url: jdbc:sqlite:data/app.db
    driver-class-name: org.sqlite.JDBC
    # HikariCP pool settings. SQLite defaults to a single connection because writes are serialized.
    # For MySQL/PostgreSQL, set maximum-pool-size based on DB capacity and expected request latency.
    # maximum-pool-size: 10
    # minimum-idle: 2
    # connection-timeout-millis: 30000
    # idle-timeout-millis: 600000
    # max-lifetime-millis: 1800000
    # SQLite busy timeout/WAL reduce immediate "database is locked" failures under light concurrency.
    # They do not make SQLite suitable for write-heavy multi-user production workloads.
    # sqlite-busy-timeout-millis: 5000
    # sqlite-journal-mode: WAL
    # username:
    # password:

    # MySQL example:
    # url: jdbc:mysql://localhost:3306/wiz_sample?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: wiz
    # password: change-me

    # PostgreSQL example:
    # url: jdbc:postgresql://localhost:5432/wiz_sample
    # driver-class-name: org.postgresql.Driver
    # username: wiz
    # password: change-me

  jpa:
    # Hibernate dialect default for SQLite.
    # MySQL: org.hibernate.dialect.MySQLDialect
    # PostgreSQL: org.hibernate.dialect.PostgreSQLDialect
    dialect: org.hibernate.community.dialect.SQLiteDialect
    # update keeps the sample easy to start. Prefer validate or none in production.
    hbm2ddl-auto: update
    # Set true temporarily when debugging generated SQL.
    show-sql: false
    format-sql: false
