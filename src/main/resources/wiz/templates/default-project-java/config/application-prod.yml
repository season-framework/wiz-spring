# WIZ Spring 운영 profile 설정입니다.
# `java -jar <standalone-wiz-app>.jar`는 profile을 지정하지 않으면 prod profile을 기본으로 사용합니다.
# `wiz-spring run --profile prod`로도 선택할 수 있으며 공통 application.yml보다 우선합니다.
# 이 파일은 Git에서 제외됩니다. 공유할 값은 application-prod.example.yml에 반영하세요.
# 운영 session cookie는 HTTPS에서만 전송합니다. prod profile은 HTTPS로 서비스하세요.
server:
  servlet:
    session:
      cookie:
        secure: true
