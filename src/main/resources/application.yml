spring:
  application:
    name: wiz-spring

server:
  address: 0.0.0.0
  port: 3000

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-system}] "
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 150MB
      clean-history-on-start: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  cache:
    disabled: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false
    query-config-enabled: false
    supported-submit-methods: []

wiz:
  root: .
  api:
    prefix: /wiz/api
  http:
    max-request-body-bytes: 0
  socket:
    path: /wiz/app
    allowed-origins:
      - "*"
    polling-session-ttl-millis: 120000
    max-polling-sessions: 1024
    polling-queue-capacity: 256
  redirect:
    policy: any
    allowed-hosts: []
  java:
    package-root: com.wiz.app
  runtime:
    devmode-cookie-name: season-wiz-devmode
    warmup-enabled: true
